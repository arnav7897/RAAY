    <path d="M147 221C224 269 277 276 359 229" fill="none" stroke="#b9c8ae" stroke-width="2" stroke-dasharray="5 8" opacity=".75"/>
    <circle cx="250" cy="212" r="9" fill="#d8dfc9" stroke="#193f31" stroke-width="5"/>

    <g transform="rotate(-5 133 210)">
      <rect x="33" y="95" width="217" height="256" rx="8" fill="#132f25" opacity=".22"/>
      <rect x="25" y="87" width="217" height="256" rx="8" fill="#fffdf8"/>
      <path d="M25 87h217v43H25z" fill="#e9e1d2"/>
      <text x="45" y="114" fill="#5b685c" font-family="'Courier New', monospace" font-size="10" letter-spacing="1.2">MASTER DIRECTION</text>
      <text x="45" y="164" fill="#29332e" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700">Applicability</text>
      <path d="M45 183h156M45 197h143M45 211h158M45 225h128" stroke="#b9b6a9" stroke-width="4" stroke-linecap="round"/>
      <rect x="44" y="250" width="171" height="61" rx="5" fill="#eef1e9"/>
      <path d="M56 267h143M56 279h127M56 291h103" stroke="#91a687" stroke-width="3" stroke-linecap="round"/>
      <circle cx="204" cy="323" r="10" fill="#245c45"/>
      <path d="m199 323 3.5 3.5 6.5-7" fill="none" stroke="#fffdf8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="rotate(4 422 215)">
      <rect x="337" y="103" width="191" height="236" rx="8" fill="#10291f" opacity=".24"/>
      <rect x="329" y="95" width="191" height="236" rx="8" fill="#f6f2e9"/>
      <path d="M329 95h191v42H329z" fill="#2b6048"/>
