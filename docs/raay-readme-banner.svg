<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title description">
  <title id="title">RAAY — know what applies, see the evidence</title>
  <desc id="description">An editorial illustration of RBI regulatory documents connected by verified source evidence.</desc>
  <rect width="1600" height="500" fill="#f4f0e6"/>
  <path d="M0 0h15v500H0z" fill="#245c45"/>
  <path d="M1000 0h600v500h-600z" fill="#193f31"/>
  <path d="M1000 0h1v500h-1z" fill="#c5a56b" opacity=".72"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="82" y="62" width="266" height="36" rx="18" fill="#e5eadf"/>
    <circle cx="102" cy="80" r="5" fill="#245c45"/>
    <text x="118" y="85" fill="#355742" font-size="13" font-weight="700" letter-spacing="2.1">REGULATORY EVIDENCE WORKSPACE</text>

    <text x="78" y="208" fill="#29332e" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" letter-spacing="-4">RAAY</text>
    <path d="M82 232h108" stroke="#c5a56b" stroke-width="4"/>
    <text x="80" y="296" fill="#29332e" font-family="Georgia, 'Times New Roman', serif" font-size="43">Know what applies.</text>
    <text x="80" y="350" fill="#245c45" font-family="Georgia, 'Times New Roman', serif" font-size="43" font-style="italic">See the evidence.</text>
    <text x="82" y="400" fill="#5e695f" font-size="17">RBI rules, relationships, and cited answers in one</text>
    <text x="82" y="426" fill="#5e695f" font-size="17">source-first workspace.</text>
    <text x="82" y="470" fill="#687366" font-family="'Courier New', monospace" font-size="11" letter-spacing="1.15">OFFICIAL TEXT  /  VERIFIED LINKS  /  TRACEABLE ANSWERS</text>
  </g>

  <g transform="translate(1060 63)">
