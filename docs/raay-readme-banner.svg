      <path d="M349 190h144M349 204h124M349 218h143" stroke="#aaa99e" stroke-width="4" stroke-linecap="round"/>
      <rect x="349" y="246" width="119" height="28" rx="14" fill="#e5eadf"/>
      <circle cx="364" cy="260" r="4" fill="#245c45"/>
      <text x="375" y="264" fill="#355742" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing=".8">QUOTE VERIFIED</text>
    </g>

    <g font-family="'Courier New', monospace" font-size="10" letter-spacing="1">
